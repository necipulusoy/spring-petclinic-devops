name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Ana branşınızı belirtin
  workflow_dispatch:  # Manuel tetikleme için ayar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
       
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        TAG="v1.$(( $(git tag | wc -l) + 1 ))"  # Tag'i otomatik artır
        echo "TAG=$TAG" >> $GITHUB_ENV  # Yeni yöntemi kullan
        docker build -t necipulusoyy9120/spring-petclinic-app:$TAG -f application/Dockerfile .
      
    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Push Docker image
      run: |
        docker push necipulusoyy9120/spring-petclinic-app:$TAG

    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: <YOUR_AWS_REGION>

    - name: Update image tag in values.yaml
      run: |
        sed -i "s|image: \"necipulusoyy9120/spring-petclinic-app:.*\"|image: \"necipulusoyy9120/spring-petclinic-app:$TAG\"|g" /home/ubuntu/helm/spring-petclinic/values.yaml

    - name: Deploy to Kubernetes
      run: |
        helm upgrade --install app /home/ubuntu/helm/spring-petclinic -n pet-clinic-prod
