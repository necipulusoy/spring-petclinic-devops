apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.deployment.name }}-deployment
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.app.deployment.name }}  
spec:
  replicas: {{ .Values.app.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.app.deployment.name }}  
  template:
    metadata:
      labels:
        app: {{ .Values.app.deployment.name }}  
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"
      securityContext: 
        runAsUser: 33  
        runAsNonRoot: true
      serviceAccountName: {{ .Release.Name }}-app-sa
      containers:
      - image: {{ .Values.app.deployment.container.image }}
        name: {{ .Values.app.deployment.container.name }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /actuator/health  
            port: 8080
          initialDelaySeconds: 180  
          periodSeconds: 30  
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30 
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90 
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 10
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-app-cm
        - secretRef:
            name: {{ .Release.Name }}-app-secret
        resources:
          limits:
            memory: 500Mi
            cpu: 150m
          requests:
            memory: 200Mi
            cpu: 80m
