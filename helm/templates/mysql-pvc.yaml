apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mysql-pv-claim
  namespace: {{ .Values.namespace.name }}
spec:
  storageClassName: {{ .Values.mysql.pvc.storageClassName }}  
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.pvc.storage }}  
