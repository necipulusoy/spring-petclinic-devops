apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-app-cm
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Release.Name }}
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: {{ .Values.app.configmap.SPRING_JPA_HIBERNATE_DDL_AUTO | quote }}
  SPRING_DATASOURCE_URL: {{ .Values.app.configmap.SPRING_DATASOURCE_URL | quote }}

